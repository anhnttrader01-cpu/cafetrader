<body>

<header>

<h1 id="title">CafeTrader Elite</h1>

<nav>

<button onclick="showPage('dashboard')">Dashboard</button>
<button onclick="showPage('portfolio')">Portfolio</button>
<button onclick="showPage('journal')">Journal</button>
<button onclick="showPage('copy')">Copy Trading</button>

<select onchange="setLang(this.value)">

<option value="en">EN</option>
<option value="vi">VI</option>
<option value="es">ES</option>
<option value="fr">FR</option>
<option value="de">DE</option>
<option value="ru">RU</option>
<option value="zh">ZH</option>
<option value="ja">JA</option>
<option value="kr">KR</option>
<option value="pt">PT</option>

</select>

</nav>

</header>

<div class="section">

<div id="dashboard">

<h2>AI Signal Dashboard</h2>

<div id="signal"></div>

<div class="grid">

<div class="box">

<h3>Gold Chart</h3>

<div id="gold_chart"></div>

</div>

<div class="box">

<h3>BTC Chart</h3>

<div id="btc_chart"></div>

</div>

</div>

</div>

<div id="portfolio" style="display:none">

<h2>Portfolio Tracker</h2>

<input id="asset" placeholder="Asset">
<input id="amount" placeholder="Amount">

<button class="main" onclick="addAsset()">Add</button>

<table>

<thead>

<tr>

<th>Asset</th>
<th>Amount</th>

</tr>

</thead>

<tbody id="portfolioTable"></tbody>

</table>

</div>

<div id="journal" style="display:none">

<h2>Trading Journal</h2>

<input id="pair" placeholder="Pair">
<input id="result" placeholder="Result">

<button class="main" onclick="addTrade()">Add Trade</button>

<table>

<thead>

<tr>

<th>Pair</th>
<th>Result</th>

</tr>

</thead>

<tbody id="journalTable"></tbody>

</table>

</div>

<div id="copy" style="display:none">

<h2>Copy Trading</h2>

<table>

<tr>

<th>Trader</th>
<th>ROI</th>
<th>Action</th>

</tr>

<tr>

<td>AlphaTrader</td>
<td>210%</td>
<td><button>Copy</button></td>

</tr>

<tr>

<td>CryptoWolf</td>
<td>180%</td>
<td><button>Copy</button></td>

</tr>

<tr>

<td>GoldSniper</td>
<td>150%</td>
<td><button>Copy</button></td>

</tr>

</table>

</div>

</div>

<script>

function showPage(id){

document.getElementById("dashboard").style.display="none"
document.getElementById("portfolio").style.display="none"
document.getElementById("journal").style.display="none"
document.getElementById("copy").style.display="none"

document.getElementById(id).style.display="block"

}

new TradingView.widget({

container_id:"gold_chart",
symbol:"OANDA:XAUUSD",
interval:"15",
theme:"dark",
width:"100%",
height:400

})

new TradingView.widget({

container_id:"btc_chart",
symbol:"BINANCE:BTCUSDT",
interval:"30",
theme:"dark",
width:"100%",
height:400

})

function aiSignal(){

let rsi=Math.random()*100

let signal="WAIT"

if(rsi<30) signal="BUY"
if(rsi>70) signal="SELL"

document.getElementById("signal").innerText="AI Signal: "+signal

}

setInterval(aiSignal,4000)

function addAsset(){

let asset=document.getElementById("asset").value
let amount=document.getElementById("amount").value

let data=JSON.parse(localStorage.getItem("portfolio"))||[]

data.push({asset,amount})

localStorage.setItem("portfolio",JSON.stringify(data))

loadPortfolio()

}

function loadPortfolio(){

let data=JSON.parse(localStorage.getItem("portfolio"))||[]

let html=""

data.forEach(d=>{

html+=`<tr><td>${d.asset}</td><td>${d.amount}</td></tr>`

})

document.getElementById("portfolioTable").innerHTML=html

}

function addTrade(){

let pair=document.getElementById("pair").value
let result=document.getElementById("result").value

let data=JSON.parse(localStorage.getItem("journal"))||[]

data.push({pair,result})

localStorage.setItem("journal",JSON.stringify(data))

loadJournal()

}

function loadJournal(){

let data=JSON.parse(localStorage.getItem("journal"))||[]

let html=""

data.forEach(d=>{

html+=`<tr><td>${d.pair}</td><td>${d.result}</td></tr>`

})

document.getElementById("journalTable").innerHTML=html

}

loadPortfolio()
loadJournal()

const lang={

en:{title:"CafeTrader Elite"},
vi:{title:"Nền tảng CafeTrader"},
es:{title:"Plataforma CafeTrader"},
fr:{title:"Plateforme CafeTrader"},
de:{title:"CafeTrader Plattform"},
ru:{title:"Платформа CafeTrader"},
zh:{title:"CafeTrader 平台"},
ja:{title:"CafeTrader プラットフォーム"},
kr:{title:"CafeTrader 플랫폼"},
pt:{title:"Plataforma CafeTrader"}

}

function setLang(l){

document.getElementById("title").innerText=lang[l].title

}

</script>

</body>
</html>
